<text x="200" y="290" font-size="11" fill="#666" text-anchor="start" font-weight="bold">Partition 2</text>
<rect x="280" y="270" width="36" height="30" rx="3" fill="#eaf4ec" stroke="#2e6b3a" stroke-width="1"/>
