<text x="87" y="245" font-size="10" fill="#222" text-anchor="middle" font-style="italic">hash(key) picks</text>
<text x="87" y="258" font-size="10" fill="#222" text-anchor="middle" font-style="italic">the partition</text>
<text x="570" y="72" font-size="10" fill="#666" text-anchor="end" font-style="italic">new messages appended on the right →</text>
<rect x="625" y="70" width="240" height="250" rx="10" fill="white" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="640" y="92" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Consumer group A</text>
<rect x="660" y="120" width="170" height="50" rx="6" fill="#f4f4f4" stroke="#666" stroke-width="1.5"/>
<text x="745.0" y="141.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Consumer 1</text>
<text x="745.0" y="157.2" font-size="11" fill="#666" text-anchor="middle" >reads partitions 0 and 1</text>
<rect x="660" y="240" width="170" height="50" rx="6" fill="#f4f4f4" stroke="#666" stroke-width="1.5"/>
<text x="745.0" y="261.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Consumer 2</text>
<text x="745.0" y="277.2" font-size="11" fill="#666" text-anchor="middle" >reads partition 2</text>
<line x1="548" y1="105" x2="658" y2="138" stroke="#2e6b3a" stroke-width="1.6" marker-end="url(#an)"/>
<line x1="472" y1="195" x2="658" y2="156" stroke="#2e6b3a" stroke-width="1.6" marker-end="url(#an)"/>
<line x1="510" y1="285" x2="658" y2="268" stroke="#2e6b3a" stroke-width="1.6" marker-end="url(#an)"/>
<text x="440" y="370" font-size="12" fill="#222" text-anchor="middle" >Each partition goes to exactly one consumer in the group, so order holds within a partition.</text>
<text x="440" y="390" font-size="12" fill="#666" text-anchor="middle" >There is no ordering guarantee across partitions.</text>
