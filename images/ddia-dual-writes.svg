<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Helvetica, Arial, sans-serif">
<rect width="880" height="400" fill="white"/>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8B2222"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="an" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b3a"/></marker>
</defs>
<text x="215" y="30" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Dual writes</text>
<rect x="15" y="60" width="95" height="44" rx="6" fill="#fbecec" stroke="#8B2222" stroke-width="1.5"/>
<text x="62.5" y="78.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Alice</text>
<text x="62.5" y="94.2" font-size="11" fill="#666" text-anchor="middle" >sets £100</text>
<rect x="15" y="215" width="95" height="44" rx="6" fill="#fbecec" stroke="#8B2222" stroke-width="1.5"/>
<text x="62.5" y="233.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Bob</text>
<text x="62.5" y="249.2" font-size="11" fill="#666" text-anchor="middle" >sets £120</text>
<rect x="265" y="55" width="155" height="54" rx="6" fill="#f4f4f4" stroke="#666" stroke-width="1.5"/>
<text x="342.5" y="78.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Database</text>
<text x="342.5" y="94.2" font-size="11" fill="#2e6b3a" text-anchor="middle" >ends at £120</text>
<rect x="265" y="210" width="155" height="54" rx="6" fill="#fbecec" stroke="#8B2222" stroke-width="1.5"/>
<text x="342.5" y="233.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Search index</text>
<text x="342.5" y="249.2" font-size="11" fill="#8B2222" text-anchor="middle" >ends at £100 ✗</text>
<line x1="110" y1="78" x2="263" y2="74" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="150" y="70" font-size="10" fill="#222" text-anchor="start" font-weight="bold" stroke="white" stroke-width="4" paint-order="stroke">1. £100</text>
<line x1="110" y1="230" x2="263" y2="94" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="213" y="125" font-size="10" fill="#222" text-anchor="end" font-weight="bold" stroke="white" stroke-width="4" paint-order="stroke">2. £120</text>
<line x1="110" y1="245" x2="263" y2="245" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="150" y="260" font-size="10" fill="#222" text-anchor="start" font-weight="bold" stroke="white" stroke-width="4" paint-order="stroke">3. £120</text>
<line x1="110" y1="90" x2="263" y2="225" stroke="#8B2222" stroke-width="2" marker-end="url(#ar)"/>
<text x="225" y="175" font-size="10" fill="#8B2222" text-anchor="start" font-weight="bold" stroke="white" stroke-width="4" paint-order="stroke">4. £100 (late)</text>
<text x="215" y="310" font-size="12" fill="#222" text-anchor="middle" >The two writes reach each system in a different order.</text>
<text x="215" y="328" font-size="12" fill="#666" text-anchor="middle" >No error, no alert, and nothing will ever fix it.</text>
<line x1="440" y1="20" x2="440" y2="385" stroke="#ddd" stroke-width="1.5"/>
<text x="665" y="30" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">One log, consumed in order</text>
<rect x="455" y="55" width="100" height="44" rx="6" fill="#fbecec" stroke="#8B2222" stroke-width="1.5"/>
<text x="505.0" y="73.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Alice, Bob</text>
<text x="505.0" y="89.2" font-size="11" fill="#666" text-anchor="middle" >write once</text>
<rect x="600" y="50" width="150" height="54" rx="6" fill="#f4f4f4" stroke="#666" stroke-width="1.5"/>
<text x="675.0" y="73.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Database</text>
<text x="675.0" y="89.2" font-size="11" fill="#666" text-anchor="middle" >£100, then £120</text>
<line x1="555" y1="77" x2="598" y2="77" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/>
<text x="592" y="160" font-size="11" fill="#666" text-anchor="end" font-style="italic">ordered</text>
<text x="592" y="174" font-size="11" fill="#666" text-anchor="end" font-style="italic">changelog (CDC)</text>
<rect x="600" y="148" width="73" height="30" rx="3" fill="#eaf4ec" stroke="#2e6b3a" stroke-width="1"/>
<text x="636" y="168" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">1: £100</text>
<rect x="675" y="148" width="73" height="30" rx="3" fill="#eaf4ec" stroke="#2e6b3a" stroke-width="1"/>
<text x="711" y="168" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">2: £120</text>
<line x1="675" y1="104" x2="675" y2="146" stroke="#666" stroke-width="1.6" marker-end="url(#ag)"/>
<rect x="455" y="235" width="130" height="50" rx="6" fill="#eaf4ec" stroke="#2e6b3a" stroke-width="1.5"/>
<text x="520.0" y="256.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Search index</text>
<text x="520.0" y="272.2" font-size="11" fill="#2e6b3a" text-anchor="middle" >£120 ✓</text>
<line x1="675" y1="178" x2="520" y2="233" stroke="#2e6b3a" stroke-width="1.6" marker-end="url(#an)"/>
<rect x="595" y="235" width="130" height="50" rx="6" fill="#eaf4ec" stroke="#2e6b3a" stroke-width="1.5"/>
<text x="660.0" y="256.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Cache</text>
<text x="660.0" y="272.2" font-size="11" fill="#2e6b3a" text-anchor="middle" >£120 ✓</text>
<line x1="675" y1="178" x2="660" y2="233" stroke="#2e6b3a" stroke-width="1.6" marker-end="url(#an)"/>
<rect x="735" y="235" width="130" height="50" rx="6" fill="#eaf4ec" stroke="#2e6b3a" stroke-width="1.5"/>
<text x="800.0" y="256.2" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Warehouse</text>
<text x="800.0" y="272.2" font-size="11" fill="#2e6b3a" text-anchor="middle" >£120 ✓</text>
<line x1="675" y1="178" x2="800" y2="233" stroke="#2e6b3a" stroke-width="1.6" marker-end="url(#an)"/>
<text x="665" y="310" font-size="12" fill="#222" text-anchor="middle" >Every consumer applies the changes in the same order,</text>
<text x="665" y="328" font-size="12" fill="#666" text-anchor="middle" >so they all end up agreeing with the database.</text>
</svg>