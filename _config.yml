title: "DublinTech"
permalink: pretty
description: "A collection of Technical Articles by Alex Staveley."
url: "https://dublintech.github.io"
baseurl: "/blogposts"
repository: "dublintech/blogposts"

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-0K0149VHX3"
    anonymize_ip: false

author:
  name: "Alex Staveley"
  avatar: "/images/me.jpg"
  bio: "Software architect exploring the intersection of AI Coding Tools and engineering discipline in the SDLC."
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/alex-staveley"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dublintech"

comments:
  provider: "giscus"
  giscus:
    repo_id: "R_kgDOTivnHw"
    category_name: "Announcements"
    category_id: "DIC_kwDOTivnH84DCAri"
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "light"

defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: false
      read_time: true
      show_date: true
      comments: true
      toc: true
      toc_sticky: true

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
